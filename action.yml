name: "Coderule: Codebase-Specific Code Review"
description: "AI-powered code review that enforces CODERULE annotations in your codebase"
branding:
  icon: check-circle
  color: blue

inputs:
  agentic:
    description: "Use Claude Code CLI for agentic review"
    required: false
    default: "false"
  model:
    description: "Model to use for review"
    required: false
    default: ""
  confidence-threshold:
    description: "Minimum confidence for reported violations (0.0-1.0)"
    required: false
    default: ""
  max-workers:
    description: "Maximum parallel rule checks"
    required: false
    default: ""
  fail-on-issues:
    description: "Fail the workflow when coderule finds violations"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install coderule
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/imbue-ai/coderule/main/install.sh \
          | CODERULE_INSTALL_DIR="${RUNNER_TEMP}/coderule/bin" bash
        echo "${RUNNER_TEMP}/coderule/bin" >> "$GITHUB_PATH"

    - name: Install Claude Code (agentic mode)
      if: inputs.agentic == 'true'
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Run coderule
      if: |
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_EVENT_NAME: ${{ github.event_name }}
        INPUT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        INPUT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        INPUT_PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_AGENTIC: ${{ inputs.agentic }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
        INPUT_MAX_WORKERS: ${{ inputs.max-workers }}
        INPUT_FAIL_ON_ISSUES: ${{ inputs.fail-on-issues }}
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
      run: bash "${{ github.action_path }}/action/run.sh"

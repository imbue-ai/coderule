name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: coderule-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: coderule-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: coderule-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: coderule-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: coderule-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile binary
        run: deno compile --allow-run --allow-read --allow-env --allow-net --target ${{ matrix.target }} --output ${{ matrix.artifact }} src/main.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=()
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              files+=("$file")
            done
          done
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes

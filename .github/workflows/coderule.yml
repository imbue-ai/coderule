name: Coderule Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coderule:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install coderule
        run: curl -fsSL https://raw.githubusercontent.com/imbue-ai/coderule/main/install.sh | bash
        env:
          CODERULE_INSTALL_DIR: /usr/local/bin

      - name: Determine base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "commit=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "commit=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run coderule
        run: coderule check --base-commit "${{ steps.base.outputs.commit }}" --output-format github
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
